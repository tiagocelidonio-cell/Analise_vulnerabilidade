services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnscope}
      POSTGRES_DB: ${POSTGRES_DB:-vulnscope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnscope}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nota: armazenamento S3 (MinIO) sera adicionado quando as evidencias grandes
  # forem para o S3. Hoje as evidencias ficam inline no banco, entao nao e preciso.

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vulnscope}:${POSTGRES_PASSWORD:-vulnscope}@db:5432/${POSTGRES_DB:-vulnscope}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: arq app.worker.tasks.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vulnscope}:${POSTGRES_PASSWORD:-vulnscope}@db:5432/${POSTGRES_DB:-vulnscope}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app

  web:
    build: ./frontend
    environment:
      # Vazio por padrao: o painel usa o proxy /api (mesma origem, porta 5173).
      # So preencha VITE_API_URL no .env para apontar a API a outro host/porta.
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
